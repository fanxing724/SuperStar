name: shuake

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * *"

jobs:
  Start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install-deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: write-config
        env:
          CX_USER: ${{ secrets.CHAOXING_USERNAME }}
          CX_PASS: ${{ secrets.CHAOXING_PASSWORD }}
          CX_COURSES: ${{ secrets.CHAOXING_COURSE_LIST }}
          AI_EP: ${{ secrets.AI_ENDPOINT }}
          AI_K: ${{ secrets.AI_KEY }}
          AI_M: ${{ secrets.AI_MODEL }}
        run: |
          python -c "
          import os
          s = os.environ
          lines = [
            '[common]',
            'use_cookies=false',
            'username=' + s['CX_USER'],
            'password=' + s['CX_PASS'],
            'course_list=' + s.get('CX_COURSES',''),
            'speed=1',
            'jobs=4',
            'notopen_action=retry',
            '',
            '[tiku]',
            'provider=AI',
            'check_llm_connection=true',
            'submit=false',
            'cover_rate=0.9',
            'delay=1.0',
            'endpoint=' + s['AI_EP'],
            'key=' + s['AI_K'],
            'model=' + s['AI_M'],
            'min_interval_seconds=3',
            'http_proxy=',
            'true_list=zhengque,dui,shi',
            'false_list=cuowu,cuo,fou,budui,buzhengque',
            '',
            '[notification]',
            'provider=DefaultNotification',
          ]
          open('config.ini','w').write(chr(10).join(lines))
          "

      - name: run-main
        run: python main.py -c config.ini
