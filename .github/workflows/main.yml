name: shuake

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * *"

jobs:
  Start:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install-deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: write-config
        env:
          CX_USER: ${{ secrets.CHAOXING_USERNAME }}
          CX_PASS: ${{ secrets.CHAOXING_PASSWORD }}
          CX_COURSES: ${{ secrets.CHAOXING_COURSE_LIST }}
          AI_EP: ${{ secrets.AI_ENDPOINT }}
          AI_K: ${{ secrets.AI_KEY }}
          AI_M: ${{ secrets.AI_MODEL }}
        run: |
          python -c "
          import os
          s = os.environ
          lines = [
            '[common]',
            '; 是否使用 cookies.txt 登录。GitHub Actions 使用账号密码登录，保持 false',
            'use_cookies=false',
            '; 超星手机号账号，从 GitHub Secrets: CHAOXING_USERNAME 读取',
            'username=' + s['CX_USER'],
            '; 超星登录密码，从 GitHub Secrets: CHAOXING_PASSWORD 读取',
            'password=' + s['CX_PASS'],
            '; 要学习的课程 ID 列表，多个课程用英文逗号分隔；从 GitHub Secrets: CHAOXING_COURSE_LIST 读取',
            'course_list=' + s.get('CX_COURSES',''),
            '; 视频播放倍速。GitHub 定时任务建议保守一点，避免异常',
            'speed=1',
            '; 同时处理的章节数。AI 题库容易触发 429，这里限制为 1',
            'jobs=1',
            '; 遇到未开放章节时重试',
            'notopen_action=retry',
            '',
            '[tiku]',
            '; 题库提供方。AI 表示使用兼容 OpenAI 格式的大模型接口答题',
            'provider=AI',
            '; 启动时是否检查大模型连接。关闭可减少一次 API 调用，降低限流概率',
            'check_llm_connection=false',
            '; 是否自动提交作业。false 表示只保存答案，不直接提交',
            'submit=false',
            '; 最低题库覆盖率。submit=true 时，覆盖率达到该值才提交',
            'cover_rate=0.9',
            '; 普通题库查询间隔，单位秒',
            'delay=1.0',
            '; 兼容 OpenAI 格式的 API Endpoint，从 GitHub Secrets: AI_ENDPOINT 读取',
            'endpoint=' + s['AI_EP'],
            '; 大模型 API Key，从 GitHub Secrets: AI_KEY 读取',
            'key=' + s['AI_K'],
            '; 大模型名称，从 GitHub Secrets: AI_MODEL 读取',
            'model=' + s['AI_M'],
            '; 大模型最小请求间隔，单位秒。调大可减少 429 Too Many Requests',
            'min_interval_seconds=8',
            '; HTTP 代理地址。GitHub Actions 默认不使用代理',
            'http_proxy=',
            '; 判断题中表示“正确”的答案写法。这里必须包含大模型返回的中文“正确/对”',
            'true_list=\u6b63\u786e,\u5bf9,\u221a,\u662f,true,1',
            '; 判断题中表示“错误”的答案写法。这里必须包含大模型返回的中文“错误/错”',
            'false_list=\u9519\u8bef,\u9519,\u00d7,\u5426,\u4e0d\u5bf9,\u4e0d\u6b63\u786e,false,0',
            '',
            '[notification]',
            '; 通知提供方。DefaultNotification 表示不额外配置外部推送',
            'provider=DefaultNotification',
          ]
          open('config.ini','w').write(chr(10).join(lines))
          "

      - name: run-main
        run: python main.py -c config.ini
