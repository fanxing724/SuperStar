name: 刷课
  on:
    workflow_dispatch:
    push:
      branches: [ main ]
    schedule:
      - cron: "0 8 * * *"

  jobs:
    Start:
      runs-on: ubuntu-latest
      timeout-minutes: 30
      steps:
        - name: 拷贝代码
          uses: actions/checkout@v4

        - name: 设置python环境
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'
            cache: pip

        - name: 安装依赖包
          run: |
            python -m pip install --upgrade pip
            pip install -r ./requirements.txt -i
  https://pypi.tuna.tsinghua.edu.cn/simple

        - name: 写入运行配置
          run: |
            cat > config.ini <<'EOFCONFIG'
  [common]
  use_cookies=false
  username=${{ secrets.CHAOXING_USERNAME }}
  password=${{ secrets.CHAOXING_PASSWORD }}
  course_list=${{ secrets.CHAOXING_COURSE_LIST }}
  speed=1
  jobs=4
  notopen_action=retry

  [tiku]
  provider=AI
  check_llm_connection=true
  submit=false
  cover_rate=0.9
  delay=1.0
  endpoint=${{ secrets.AI_ENDPOINT }}
  key=${{ secrets.AI_KEY }}
  model=${{ secrets.AI_MODEL }}
  min_interval_seconds=3
  http_proxy=
  true_list=正确,对,√,是
  false_list=错误,错,×,否,不对,不正确

  [notification]
  provider=DefaultNotification
  EOFCONFIG

        - name: Run main.py
          run: python main.py -c config.ini
